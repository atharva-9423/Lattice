<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');

      .serif-title {
        font-family: 'Fraunces', 'Instrument Serif', Georgia, 'Times New Roman', serif;
        font-weight: 600;
        fill: #141312;
        letter-spacing: -0.025em;
      }
      .sans-body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        fill: #524E48;
      }
      .sans-bold {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #141312;
      }
      .mono-label {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 3.2s linear infinite;
      }
      .flow-line-fast {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.1s linear infinite;
      }
      .pulse-ring {
        transform-origin: 935px 195px;
        animation: corePulse 3s ease-in-out infinite;
      }
      .pulse-ring-outer {
        transform-origin: 935px 195px;
        animation: corePulseOuter 3s ease-in-out infinite;
      }
      .node-float-1 {
        animation: floatNode 4s ease-in-out infinite;
      }
      .node-float-2 {
        animation: floatNode 4.5s ease-in-out infinite 0.8s;
      }
      .node-float-3 {
        animation: floatNode 3.8s ease-in-out infinite 1.5s;
      }
      .node-float-4 {
        animation: floatNode 4.2s ease-in-out infinite 2.2s;
      }
      .bar-fill {
        animation: riskBarFill 4s ease-in-out infinite alternate;
      }
      .blink-dot {
        animation: blinkDot 1.8s ease-in-out infinite;
      }
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -56;
        }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(1); opacity: 0.32; }
        50% { transform: scale(1.18); opacity: 0.12; }
      }
      @keyframes corePulseOuter {
        0%, 100% { transform: scale(1); opacity: 0.16; }
        50% { transform: scale(1.28); opacity: 0.04; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes riskBarFill {
        0% { width: 178px; }
        100% { width: 196px; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>

    <pattern id="editorialGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E6E0D6" stroke-width="0.7" opacity="0.65"/>
    </pattern>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C84B31"/>
      <stop offset="100%" stop-color="#E06D53"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141312" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Outer Archival Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#paperGrad)" stroke="#141312" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="400" rx="12" fill="url(#editorialGrid)" stroke="#E6E0D6" stroke-width="1"/>

  <!-- Top Editorial Masthead Strip -->
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#E6E0D6" stroke-width="1.5"/>

  <!-- Brand Mark Icon (Vector) -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="26" height="26" rx="6" fill="#141312"/>
    <circle cx="8" cy="8" r="2.2" fill="#FAF7F2"/>
    <circle cx="18" cy="8" r="2.2" fill="#C84B31"/>
    <circle cx="8" cy="18" r="2.2" fill="#FAF7F2"/>
    <circle cx="18" cy="18" r="2.2" fill="#FAF7F2"/>
    <line x1="8" y1="8" x2="18" y2="18" stroke="#FAF7F2" stroke-width="1.3"/>
    <line x1="18" y1="8" x2="8" y2="18" stroke="#C84B31" stroke-width="1.3"/>
    <text x="36" y="18" class="mono-label" font-size="12" fill="#141312">LATTICE · SIH26264 SMART AUTOMATION</text>
  </g>

  <!-- Live Telemetry Status Pill (Top Right) -->
  <g transform="translate(888, 24)">
    <rect x="0" y="0" width="272" height="26" rx="6" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4" fill="#C84B31" class="blink-dot"/>
    <text x="27" y="17" class="mono-label" font-size="10.5" fill="#141312">CROSS-CELL ENGINE: ACTIVE · SEED 26264</text>
  </g>

  <!-- Left Column: Editorial Headline & Value Proposition -->
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="236" height="24" rx="4" fill="#FDECE8" stroke="#C84B31" stroke-width="1"/>
    <path d="M12 7 L17 12 L12 17 M7 12 L17 12" fill="none" stroke="#C84B31" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="16" class="mono-label" font-size="10" fill="#A62616">AICTE OVERSIGHT &amp; RISK INTELLIGENCE</text>

    <text x="0" y="64" class="serif-title" font-size="44">Lattice — Institutional</text>
    <text x="0" y="112" class="serif-title" font-size="44">Complaint Intelligence</text>

    <text x="0" y="148" class="sans-body" font-size="15.5">
      Unifying fragmented complaints across AICTE bureaus (<tspan class="sans-bold" fill="#2A5C8A">AB</tspan>, <tspan class="sans-bold" fill="#1E5E3A">ACB</tspan>, <tspan class="sans-bold" fill="#C84B31">SGC</tspan>, <tspan class="sans-bold" fill="#6A3D9A">VC</tspan>) into an
    </text>
    <text x="0" y="171" class="sans-body" font-size="15.5">
      explainable 5-factor Institution Risk Engine, TF-IDF cross-cell case linker,
    </text>
    <text x="0" y="194" class="sans-body" font-size="15.5">
      predictive SLA breach monitor, and strict 4-role RBAC governance suite.
    </text>

    <!-- Bottom Metric Cards Strip -->
    <g transform="translate(0, 222)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="148" height="68" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="14" y="23" class="mono-label" font-size="9.5" fill="#8C857B">UNIFIED BUREAUS</text>
      <text x="14" y="51" class="serif-title" font-size="26">4 Cells</text>
      <text x="98" y="50" class="mono-label" font-size="10" fill="#C84B31">AB·ACB·SGC·VC</text>

      <!-- Metric 2 -->
      <rect x="160" y="0" width="156" height="68" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="174" y="23" class="mono-label" font-size="9.5" fill="#8C857B">RISK FORMULA</text>
      <text x="174" y="51" class="serif-title" font-size="26">5 Factors</text>
      <text x="278" y="50" class="mono-label" font-size="10" fill="#1E5E3A">0–100</text>

      <!-- Metric 3 -->
      <rect x="328" y="0" width="156" height="68" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="342" y="23" class="mono-label" font-size="9.5" fill="#8C857B">RBAC GOVERNANCE</text>
      <text x="342" y="51" class="serif-title" font-size="26">4 Roles</text>
      <text x="434" y="50" class="mono-label" font-size="10" fill="#2A5C8A">SEC 3.0</text>

      <!-- Metric 4 -->
      <rect x="496" y="0" width="164" height="68" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="510" y="23" class="mono-label" font-size="9.5" fill="#8C857B">EARLY WARNINGS</text>
      <text x="510" y="51" class="serif-title" font-size="26">R1 – R4</text>
      <text x="608" y="50" class="mono-label" font-size="10" fill="#6A3D9A">AUTO</text>
    </g>
  </g>

  <!-- Right Column: Animated Cross-Cell Network Topology & Risk Core -->
  <g>
    <!-- Container Card -->
    <rect x="730" y="84" width="430" height="298" rx="14" fill="#FAF7F2" stroke="#141312" stroke-width="1.5" filter="url(#cardShadow)"/>
    <line x1="730" y1="120" x2="1160" y2="120" stroke="#E6E0D6" stroke-width="1"/>
    <text x="748" y="106" class="mono-label" font-size="10.5" fill="#524E48">LIVE CROSS-CELL CONVERGENCE TOPOLOGY</text>
    <text x="1055" y="106" class="mono-label" font-size="10" fill="#C84B31">TF-IDF + 90D</text>

    <!-- Animated Connection Edges -->
    <line x1="805" y1="162" x2="935" y2="215" stroke="#C84B31" stroke-width="2.2" class="flow-line-fast"/>
    <line x1="1070" y1="162" x2="935" y2="215" stroke="#1E5E3A" stroke-width="2" class="flow-line"/>
    <line x1="805" y1="278" x2="935" y2="215" stroke="#2A5C8A" stroke-width="2" class="flow-line"/>
    <line x1="1070" y1="278" x2="935" y2="215" stroke="#6A3D9A" stroke-width="2" class="flow-line-fast"/>

    <!-- Cross-Unit Context Arcs -->
    <path d="M 805 162 Q 937 125 1070 162" fill="none" stroke="#8C857B" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M 805 278 Q 937 315 1070 278" fill="none" stroke="#8C857B" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Central Pulsing Rings -->
    <circle cx="935" cy="215" r="56" fill="#C84B31" class="pulse-ring-outer"/>
    <circle cx="935" cy="215" r="44" fill="#C84B31" class="pulse-ring"/>

    <!-- Central Institution Risk Core -->
    <circle cx="935" cy="215" r="36" fill="#141312" stroke="#C84B31" stroke-width="2.5"/>
    <text x="935" y="205" text-anchor="middle" class="mono-label" font-size="8.5" fill="#F2ECE1">RISK SCORE</text>
    <text x="935" y="227" text-anchor="middle" class="serif-title" font-size="24" fill="#FAF7F2">86</text>
    <text x="935" y="240" text-anchor="middle" class="mono-label" font-size="8" fill="#E06D53">CRITICAL</text>

    <!-- Node 1: SGC (Top Left) -->
    <g class="node-float-1">
      <rect x="752" y="138" width="106" height="46" rx="8" fill="#FDECE8" stroke="#C84B31" stroke-width="1.5"/>
      <circle cx="768" cy="154" r="4" fill="#C84B31"/>
      <text x="778" y="158" class="mono-label" font-size="11" fill="#A62616">SGC CELL</text>
      <text x="764" y="174" class="sans-body" font-size="10.5" fill="#524E48">Fee &amp; Welfare</text>
    </g>

    <!-- Node 2: ACB (Top Right) -->
    <g class="node-float-2">
      <rect x="1016" y="138" width="110" height="46" rx="8" fill="#EBF5EE" stroke="#1E5E3A" stroke-width="1.5"/>
      <circle cx="1032" cy="154" r="4" fill="#1E5E3A"/>
      <text x="1042" y="158" class="mono-label" font-size="11" fill="#1E5E3A">ACB BUREAU</text>
      <text x="1028" y="174" class="sans-body" font-size="10.5" fill="#524E48">Faculty &amp; Exams</text>
    </g>

    <!-- Node 3: AB (Bottom Left) -->
    <g class="node-float-3">
      <rect x="752" y="254" width="106" height="46" rx="8" fill="#EAF1F8" stroke="#2A5C8A" stroke-width="1.5"/>
      <circle cx="768" cy="270" r="4" fill="#2A5C8A"/>
      <text x="778" y="274" class="mono-label" font-size="11" fill="#2A5C8A">AB BUREAU</text>
      <text x="764" y="290" class="sans-body" font-size="10.5" fill="#524E48">Infra &amp; Intake</text>
    </g>

    <!-- Node 4: VC (Bottom Right) -->
    <g class="node-float-4">
      <rect x="1016" y="254" width="110" height="46" rx="8" fill="#F3ECF8" stroke="#6A3D9A" stroke-width="1.5"/>
      <circle cx="1032" cy="270" r="4" fill="#6A3D9A"/>
      <text x="1042" y="274" class="mono-label" font-size="11" fill="#6A3D9A">VC CELL</text>
      <text x="1028" y="290" class="sans-body" font-size="10.5" fill="#524E48">Vigilance Audit</text>
    </g>

    <!-- Bottom Telemetry Footer inside Right Card -->
    <rect x="748" y="324" width="394" height="42" rx="8" fill="#F2ECE1" stroke="#E6E0D6" stroke-width="1"/>
    <text x="762" y="342" class="mono-label" font-size="9.5" fill="#524E48">MERIDIAN INST. OF TECHNOLOGY</text>
    <text x="762" y="357" class="mono-label" font-size="9.5" fill="#A62616">ALERT R1 + R2 TRIGGERED · 4 BUREAUS LINKED</text>
    <rect x="936" y="338" width="192" height="10" rx="5" fill="#E6E0D6"/>
    <rect x="936" y="338" width="184" height="10" rx="5" fill="url(#accentGrad)" class="bar-fill"/>
  </g>
</svg>

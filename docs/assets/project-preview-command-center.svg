<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .ui-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; fill: #141312; }
      .ui-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #141312; }
      .ui-sans-muted { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #524E48; }
      .ui-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
      .spark-anim {
        stroke-dasharray: 240;
        stroke-dashoffset: 0;
        animation: sparkPulse 4s ease-in-out infinite alternate;
      }
      @keyframes sparkPulse {
        0% { stroke-opacity: 0.75; }
        100% { stroke-opacity: 1; }
      }
    </style>
    <filter id="winShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141312" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="10" y="10" width="1180" height="600" rx="16" fill="#FAF7F2" stroke="#141312" stroke-width="2" filter="url(#winShadow)"/>

  <!-- Browser Title Bar -->
  <path d="M 12 26 Q 12 12 26 12 L 1174 12 Q 1188 12 1188 26 L 1188 54 L 12 54 Z" fill="#F2ECE1"/>
  <line x1="10" y1="54" x2="1190" y2="54" stroke="#E6E0D6" stroke-width="1.5"/>
  <circle cx="34" cy="33" r="6" fill="#C84B31"/>
  <circle cx="54" cy="33" r="6" fill="#D9822B"/>
  <circle cx="74" cy="33" r="6" fill="#1E5E3A"/>

  <!-- URL Bar -->
  <rect x="340" y="20" width="520" height="26" rx="6" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1"/>
  <text x="600" y="37" text-anchor="middle" class="ui-mono" font-size="11" fill="#524E48">lattice.aicte.gov.in/overview · Executive Command Center</text>

  <!-- Top App Navigation Bar -->
  <rect x="12" y="55" width="1176" height="52" fill="#FAF7F2"/>
  <line x1="12" y1="107" x2="1188" y2="107" stroke="#E6E0D6" stroke-width="1"/>
  <rect x="34" y="69" width="24" height="24" rx="5" fill="#141312"/>
  <text x="68" y="86" class="ui-serif" font-size="18">Lattice</text>
  <text x="132" y="85" class="ui-mono" font-size="10" fill="#8C857B">AICTE INTELLIGENCE</text>

  <!-- Nav Pills -->
  <rect x="270" y="68" width="84" height="28" rx="6" fill="#141312"/>
  <text x="312" y="86" text-anchor="middle" class="ui-sans" font-size="12" font-weight="600" fill="#FAF7F2">Overview</text>
  <text x="392" y="86" class="ui-sans-muted" font-size="12" font-weight="500">Complaints</text>
  <text x="482" y="86" class="ui-sans-muted" font-size="12" font-weight="500">Link Queue</text>
  <text x="572" y="86" class="ui-sans-muted" font-size="12" font-weight="500">Institutions</text>
  <text x="664" y="86" class="ui-sans-muted" font-size="12" font-weight="500">Alerts</text>
  <text x="724" y="86" class="ui-sans-muted" font-size="12" font-weight="500">Register Complaint</text>

  <!-- User Session Badge -->
  <rect x="948" y="66" width="218" height="32" rx="8" fill="#F2ECE1" stroke="#E6E0D6" stroke-width="1"/>
  <circle cx="966" cy="82" r="5" fill="#1E5E3A"/>
  <text x="978" y="80" class="ui-sans" font-size="11" font-weight="700">Prof. Devendra Singh</text>
  <text x="978" y="92" class="ui-mono" font-size="9" fill="#C84B31">CHAIRMAN · ALL BUREAUS</text>

  <!-- KPI Row (4 Cards) -->
  <g transform="translate(34, 126)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="268" height="92" rx="12" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <text x="18" y="26" class="ui-mono" font-size="10" fill="#8C857B">ACTIVE OPEN COMPLAINTS</text>
    <text x="18" y="64" class="ui-serif" font-size="34">68</text>
    <rect x="172" y="44" width="80" height="22" rx="5" fill="#FDECE8"/>
    <text x="212" y="59" text-anchor="middle" class="ui-mono" font-size="10" fill="#A62616">4 BUREAUS</text>

    <!-- KPI 2 -->
    <rect x="288" y="0" width="268" height="92" rx="12" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <text x="306" y="26" class="ui-mono" font-size="10" fill="#8C857B">HIGH / CRITICAL INSTITUTIONS</text>
    <text x="306" y="64" class="ui-serif" font-size="34" fill="#A62616">7</text>
    <rect x="444" y="44" width="96" height="22" rx="5" fill="#FDECE8"/>
    <text x="492" y="59" text-anchor="middle" class="ui-mono" font-size="10" fill="#A62616">SCORE ≥ 50</text>

    <!-- KPI 3 -->
    <rect x="576" y="0" width="268" height="92" rx="12" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <text x="594" y="26" class="ui-mono" font-size="10" fill="#8C857B">SLA AT-RISK &amp; BREACHED</text>
    <text x="594" y="64" class="ui-serif" font-size="34" fill="#9A5B13">14</text>
    <rect x="734" y="44" width="94" height="22" rx="5" fill="#FEF4E6"/>
    <text x="781" y="59" text-anchor="middle" class="ui-mono" font-size="10" fill="#9A5B13">P(BREACH)</text>

    <!-- KPI 4 -->
    <rect x="864" y="0" width="268" height="92" rx="12" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <text x="882" y="26" class="ui-mono" font-size="10" fill="#8C857B">CROSS-CELL LINK CLUSTERS</text>
    <text x="882" y="64" class="ui-serif" font-size="34" fill="#2A5C8A">19</text>
    <rect x="1020" y="44" width="96" height="22" rx="5" fill="#EAF1F8"/>
    <text x="1068" y="59" text-anchor="middle" class="ui-mono" font-size="10" fill="#2A5C8A">TF-IDF LINKS</text>
  </g>

  <!-- Main Split Grid: Left = High-Risk Institution Watchlist, Right = 5-Factor Explainable Breakdown -->
  <g transform="translate(34, 238)">
    <!-- Left Card: Institution Risk Watchlist -->
    <rect x="0" y="0" width="660" height="346" rx="14" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.5"/>
    <text x="22" y="30" class="ui-mono" font-size="10" fill="#C84B31">NATIONAL RISK WATCHLIST · 90-DAY ROLLING WINDOW</text>
    <text x="22" y="54" class="ui-serif" font-size="20">Priority Institutions Under Multi-Cell Scrutiny</text>
    <line x1="0" y1="68" x2="660" y2="68" stroke="#E6E0D6" stroke-width="1"/>

    <!-- Row 1: Meridian Institute of Technology (Highlighted) -->
    <rect x="14" y="80" width="632" height="74" rx="10" fill="#FDECE8" stroke="#C84B31" stroke-width="1.2"/>
    <text x="30" y="104" class="ui-sans" font-size="14" font-weight="700">1. Meridian Institute of Technology</text>
    <text x="30" y="123" class="ui-sans-muted" font-size="12">Pune, Maharashtra · 14 Open Cases across SGC, ACB, AB, VC</text>
    <text x="30" y="142" class="ui-mono" font-size="10" fill="#A62616">PATTERN: FEE REFUND WITHHOLDING + LAB SAFETY + FACULTY SHORTAGE</text>
    <!-- Sparkline -->
    <polyline points="420,132 435,128 450,122 465,118 480,110 495,104 510,96 525,90" fill="none" stroke="#C84B31" stroke-width="2.5" class="spark-anim"/>
    <!-- Score Badge -->
    <rect x="548" y="92" width="84" height="48" rx="8" fill="#141312"/>
    <text x="590" y="114" text-anchor="middle" class="ui-serif" font-size="20" fill="#FAF7F2">86</text>
    <text x="590" y="131" text-anchor="middle" class="ui-mono" font-size="9" fill="#E06D53">CRITICAL</text>

    <!-- Row 2 -->
    <rect x="14" y="164" width="632" height="54" rx="8" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1"/>
    <text x="30" y="187" class="ui-sans" font-size="13.5" font-weight="700">2. Apex College of Engineering &amp; Research</text>
    <text x="30" y="206" class="ui-sans-muted" font-size="11.5">Hyderabad, Telangana · 9 Open Cases (ACB, SGC, AB)</text>
    <polyline points="420,202 440,198 460,192 480,189 500,182 525,178" fill="none" stroke="#C84B31" stroke-width="2"/>
    <rect x="548" y="172" width="84" height="38" rx="6" fill="#FDECE8"/>
    <text x="590" y="196" text-anchor="middle" class="ui-mono" font-size="12" fill="#A62616">74 · CRIT</text>

    <!-- Row 3 -->
    <rect x="14" y="226" width="632" height="54" rx="8" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1"/>
    <text x="30" y="249" class="ui-sans" font-size="13.5" font-weight="700">3. Vanguard Technical University</text>
    <text x="30" y="268" class="ui-sans-muted" font-size="11.5">Bengaluru, Karnataka · 7 Open Cases (SGC, VC, ACB)</text>
    <polyline points="420,262 440,260 460,254 480,248 500,245 525,242" fill="none" stroke="#D9822B" stroke-width="2"/>
    <rect x="548" y="234" width="84" height="38" rx="6" fill="#FEF4E6"/>
    <text x="590" y="258" text-anchor="middle" class="ui-mono" font-size="12" fill="#9A5B13">63 · HIGH</text>

    <!-- Row 4 -->
    <rect x="14" y="288" width="632" height="46" rx="8" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1"/>
    <text x="30" y="315" class="ui-sans" font-size="13.5" font-weight="700">4. Crescent Institute of Pharmaceutical Sciences</text>
    <rect x="548" y="295" width="84" height="32" rx="6" fill="#FEF4E6"/>
    <text x="590" y="316" text-anchor="middle" class="ui-mono" font-size="12" fill="#9A5B13">56 · HIGH</text>

    <!-- Right Card: 5-Factor Explainable Risk Breakdown -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="452" height="346" rx="14" fill="#FAF7F2" stroke="#141312" stroke-width="1.5"/>
      <text x="22" y="30" class="ui-mono" font-size="10" fill="#C84B31">EXPLAINABLE AI AUDIT · WHY THIS SCORE (86/100)</text>
      <text x="22" y="54" class="ui-serif" font-size="20">5-Factor Weighted Decomposition</text>
      <line x1="0" y1="68" x2="452" y2="68" stroke="#E6E0D6" stroke-width="1"/>

      <!-- Factor 1: V -->
      <text x="22" y="94" class="ui-sans" font-size="12.5" font-weight="700">V · Normalized Volume (30% weight)</text>
      <text x="430" y="94" text-anchor="end" class="ui-mono" font-size="12" fill="#C84B31">26.4 / 30 pts</text>
      <rect x="22" y="102" width="408" height="8" rx="4" fill="#E6E0D6"/>
      <rect x="22" y="102" width="360" height="8" rx="4" fill="#C84B31"/>

      <!-- Factor 2: S -->
      <text x="22" y="140" class="ui-sans" font-size="12.5" font-weight="700">S · Severity Mix Index (25% weight)</text>
      <text x="430" y="140" text-anchor="end" class="ui-mono" font-size="12" fill="#C84B31">21.8 / 25 pts</text>
      <rect x="22" y="148" width="408" height="8" rx="4" fill="#E6E0D6"/>
      <rect x="22" y="148" width="352" height="8" rx="4" fill="#C84B31"/>

      <!-- Factor 3: R -->
      <text x="22" y="186" class="ui-sans" font-size="12.5" font-weight="700">R · Duplicate &amp; Cluster Repetition (20%)</text>
      <text x="430" y="186" text-anchor="end" class="ui-mono" font-size="12" fill="#D9822B">16.2 / 20 pts</text>
      <rect x="22" y="194" width="408" height="8" rx="4" fill="#E6E0D6"/>
      <rect x="22" y="194" width="330" height="8" rx="4" fill="#D9822B"/>

      <!-- Factor 4: A -->
      <text x="22" y="232" class="ui-sans" font-size="12.5" font-weight="700">A · Unresolved Ageing &amp; SLA Overdue (15%)</text>
      <text x="430" y="232" text-anchor="end" class="ui-mono" font-size="12" fill="#2A5C8A">11.6 / 15 pts</text>
      <rect x="22" y="240" width="408" height="8" rx="4" fill="#E6E0D6"/>
      <rect x="22" y="240" width="315" height="8" rx="4" fill="#2A5C8A"/>

      <!-- Factor 5: X -->
      <text x="22" y="278" class="ui-sans" font-size="12.5" font-weight="700">X · Cross-Cell Bureau Spread (10% weight)</text>
      <text x="430" y="278" text-anchor="end" class="ui-mono" font-size="12" fill="#1E5E3A">10.0 / 10 pts</text>
      <rect x="22" y="286" width="408" height="8" rx="4" fill="#E6E0D6"/>
      <rect x="22" y="286" width="408" height="8" rx="4" fill="#1E5E3A"/>

      <!-- Formula Callout -->
      <rect x="22" y="306" width="408" height="28" rx="6" fill="#F2ECE1"/>
      <text x="226" y="324" text-anchor="middle" class="ui-mono" font-size="10.5" fill="#141312">Score = round(100 × (0.30V + 0.25S + 0.20R + 0.15A + 0.10X)) = 86</text>
    </g>
  </g>
</svg>

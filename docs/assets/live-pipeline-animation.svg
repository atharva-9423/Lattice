<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');

      .stage-title {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: 18px;
        fill: #141312;
      }
      .stage-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 12px;
        fill: #524E48;
      }
      .mono-tag {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.06em;
      }
      .connector-stream {
        stroke-dasharray: 7 5;
        animation: streamMove 2s linear infinite;
      }
      .stage-pulse {
        animation: pulseGlow 2.6s ease-in-out infinite;
      }
      @keyframes streamMove {
        to { stroke-dashoffset: -48; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
    <filter id="softDrop" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#141312" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="1196" height="286" rx="16" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.5"/>

  <!-- Header Strip -->
  <text x="32" y="34" class="mono-tag" fill="#C84B31">REAL-TIME INTELLIGENCE PIPELINE · DETERMINISTIC EXECUTION FLOW</text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#E6E0D6" stroke-width="1"/>

  <!-- Animated Connectors between the 4 Cards -->
  <line x1="286" y1="162" x2="322" y2="162" stroke="#C84B31" stroke-width="2.5" class="connector-stream"/>
  <polygon points="320,157 328,162 320,167" fill="#C84B31"/>

  <line x1="576" y1="162" x2="612" y2="162" stroke="#C84B31" stroke-width="2.5" class="connector-stream"/>
  <polygon points="610,157 618,162 610,167" fill="#C84B31"/>

  <line x1="866" y1="162" x2="902" y2="162" stroke="#C84B31" stroke-width="2.5" class="connector-stream"/>
  <polygon points="900,157 908,162 900,167" fill="#C84B31"/>

  <!-- STAGE 01: NLP Classification & Live Override -->
  <g transform="translate(32, 66)" filter="url(#softDrop)">
    <rect x="0" y="0" width="254" height="194" rx="12" fill="#FAF7F2" stroke="#141312" stroke-width="1.3"/>
    <rect x="16" y="16" width="76" height="22" rx="4" fill="#FDECE8"/>
    <text x="26" y="31" class="mono-tag" fill="#A62616">STAGE 01</text>
    <circle cx="228" cy="27" r="5" fill="#C84B31" class="stage-pulse"/>

    <text x="16" y="64" class="stage-title">NLP Intake &amp; Routing</text>
    <text x="16" y="86" class="stage-sub">Weighted phrase (+2.6) &amp; keyword</text>
    <text x="16" y="104" class="stage-sub">(+1.25) lexicon across 8 categories</text>
    <text x="16" y="122" class="stage-sub">with live UI unit/category override.</text>

    <rect x="16" y="140" width="222" height="38" rx="6" fill="#F2ECE1"/>
    <text x="26" y="156" class="mono-tag" fill="#141312">CONFIDENCE: [0.58, 0.96]</text>
    <text x="26" y="170" class="mono-tag" fill="#2A5C8A">ROUTES → AB | ACB | SGC | VC</text>
  </g>

  <!-- STAGE 02: TF-IDF Cross-Cell Linker -->
  <g transform="translate(322, 66)" filter="url(#softDrop)">
    <rect x="0" y="0" width="254" height="194" rx="12" fill="#FAF7F2" stroke="#141312" stroke-width="1.3"/>
    <rect x="16" y="16" width="76" height="22" rx="4" fill="#EAF1F8"/>
    <text x="26" y="31" class="mono-tag" fill="#2A5C8A">STAGE 02</text>
    <circle cx="228" cy="27" r="5" fill="#2A5C8A" class="stage-pulse"/>

    <text x="16" y="64" class="stage-title">TF-IDF Case Linker</text>
    <text x="16" y="86" class="stage-sub">Unigram + bigram L2-normalized</text>
    <text x="16" y="104" class="stage-sub">cosine similarity + Union-Find</text>
    <text x="16" y="122" class="stage-sub">connected component clustering.</text>

    <rect x="16" y="140" width="222" height="38" rx="6" fill="#F2ECE1"/>
    <text x="26" y="156" class="mono-tag" fill="#A62616">DUP ≥ 0.60 | SIM 0.30–0.59</text>
    <text x="26" y="170" class="mono-tag" fill="#524E48">CONTEXT: CROSS-UNIT ≤ 45D</text>
  </g>

  <!-- STAGE 03: 5-Factor Risk Engine -->
  <g transform="translate(612, 66)" filter="url(#softDrop)">
    <rect x="0" y="0" width="254" height="194" rx="12" fill="#FAF7F2" stroke="#141312" stroke-width="1.3"/>
    <rect x="16" y="16" width="76" height="22" rx="4" fill="#EBF5EE"/>
    <text x="26" y="31" class="mono-tag" fill="#1E5E3A">STAGE 03</text>
    <circle cx="228" cy="27" r="5" fill="#1E5E3A" class="stage-pulse"/>

    <text x="16" y="64" class="stage-title">5-Factor Risk Score</text>
    <text x="16" y="86" class="stage-sub">Rolling 90-day weighted index:</text>
    <text x="16" y="104" class="stage-sub">Volume (30%), Severity (25%),</text>
    <text x="16" y="122" class="stage-sub">Repeat (20%), Age (15%), Spread (10%).</text>

    <rect x="16" y="140" width="222" height="38" rx="6" fill="#F2ECE1"/>
    <text x="26" y="156" class="mono-tag" fill="#141312">SCORE = 100 × Σ(Wi · Fi)</text>
    <text x="26" y="170" class="mono-tag" fill="#1E5E3A">LOW | WATCH | HIGH | CRITICAL</text>
  </g>

  <!-- STAGE 04: SLA & Early-Warning Alerts -->
  <g transform="translate(902, 66)" filter="url(#softDrop)">
    <rect x="0" y="0" width="266" height="194" rx="12" fill="#FAF7F2" stroke="#141312" stroke-width="1.3"/>
    <rect x="16" y="16" width="76" height="22" rx="4" fill="#F3ECF8"/>
    <text x="26" y="31" class="mono-tag" fill="#6A3D9A">STAGE 04</text>
    <circle cx="240" cy="27" r="5" fill="#6A3D9A" class="stage-pulse"/>

    <text x="16" y="64" class="stage-title">SLA &amp; Alert Rules</text>
    <text x="16" y="86" class="stage-sub">Predicts deadline breach probability</text>
    <text x="16" y="104" class="stage-sub">&amp; triggers automated early-warning</text>
    <text x="16" y="122" class="stage-sub">alerts across all AICTE bureaus.</text>

    <rect x="16" y="140" width="234" height="38" rx="6" fill="#F2ECE1"/>
    <text x="26" y="156" class="mono-tag" fill="#6A3D9A">R1 BAND ≥ 70 | R2 ≥ 3 CELLS/30D</text>
    <text x="26" y="170" class="mono-tag" fill="#A62616">R3 SLA BREACH | R4 CLUSTER ≥ 3</text>
  </g>
</svg>

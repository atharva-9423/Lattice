<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .p-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; fill: #141312; }
      .p-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #141312; }
      .p-muted { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #524E48; }
      .p-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
      .edge-flow {
        stroke-dasharray: 6 5;
        animation: edgeMove 2.4s linear infinite;
      }
      @keyframes edgeMove {
        to { stroke-dashoffset: -44; }
      }
    </style>
    <filter id="panelShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141312" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- LEFT WINDOW: Live Intake & Real-Time Intelligence Preview -->
  <g transform="translate(10, 10)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="578" height="520" rx="16" fill="#FAF7F2" stroke="#141312" stroke-width="1.8"/>
    <!-- Window Bar -->
    <path d="M 2 16 Q 2 2 16 2 L 562 2 Q 576 2 576 16 L 576 42 L 2 42 Z" fill="#F2ECE1"/>
    <circle cx="22" cy="22" r="5" fill="#C84B31"/>
    <circle cx="38" cy="22" r="5" fill="#D9822B"/>
    <circle cx="54" cy="22" r="5" fill="#1E5E3A"/>
    <text x="290" y="26" text-anchor="middle" class="p-mono" font-size="10.5" fill="#524E48">/complaints/new · Real-Time Intelligence Preview</text>

    <!-- Header -->
    <text x="24" y="72" class="p-mono" font-size="10" fill="#C84B31">REAL-TIME INTELLIGENCE PREVIEW · LIVE CROSS-CELL ANALYSIS</text>
    <text x="24" y="96" class="p-serif" font-size="20">Interactive Unit &amp; Category Assignment</text>

    <!-- Live Classification & Override Card -->
    <rect x="24" y="112" width="530" height="178" rx="12" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.4"/>
    <text x="40" y="136" class="p-mono" font-size="10" fill="#141312">LIVE ROUTING ASSIGNMENT</text>
    <rect x="424" y="122" width="114" height="20" rx="4" fill="#F2ECE1"/>
    <text x="481" y="136" text-anchor="middle" class="p-mono" font-size="9.5" fill="#524E48">94% NLP CONF.</text>

    <!-- Dropdown 1: Assigned Category -->
    <text x="40" y="164" class="p-muted" font-size="11.5" font-weight="600">Assigned Category (Live Select)</text>
    <rect x="40" y="172" width="242" height="34" rx="7" fill="#F2ECE1" stroke="#141312" stroke-width="1"/>
    <text x="52" y="193" class="p-sans" font-size="12" font-weight="600">Fee and Refund (SGC)</text>
    <polygon points="264,186 272,186 268,193" fill="#141312"/>

    <!-- Dropdown 2: Assigned Unit -->
    <text x="296" y="164" class="p-muted" font-size="11.5" font-weight="600">Assigned Unit (Live Select)</text>
    <rect x="296" y="172" width="242" height="34" rx="7" fill="#FDECE8" stroke="#C84B31" stroke-width="1.2"/>
    <text x="308" y="193" class="p-mono" font-size="11" fill="#A62616">SGC — Student Grievance Cell</text>
    <polygon points="520,186 528,186 524,193" fill="#A62616"/>

    <!-- Dropdown 3: Assigned Severity -->
    <text x="40" y="230" class="p-muted" font-size="11.5" font-weight="600">Assigned Severity</text>
    <rect x="40" y="238" width="242" height="34" rx="7" fill="#F2ECE1" stroke="#E6E0D6" stroke-width="1"/>
    <text x="52" y="259" class="p-sans" font-size="12" font-weight="600">Critical (72h SLA Window)</text>

    <!-- Projected Risk Impact Box -->
    <rect x="296" y="222" width="242" height="54" rx="8" fill="#FAF7F2" stroke="#141312" stroke-width="1.2"/>
    <text x="308" y="240" class="p-mono" font-size="9.5" fill="#524E48">PROJECTED RISK IMPACT</text>
    <text x="308" y="264" class="p-serif" font-size="18">78 High → 86 Critical</text>
    <text x="526" y="264" text-anchor="end" class="p-mono" font-size="13" fill="#C84B31">+8</text>

    <!-- Matched Linked Cases -->
    <text x="24" y="316" class="p-mono" font-size="10" fill="#524E48">MATCHED LINKED CASES (3) · TF-IDF + CROSS-UNIT WINDOW</text>

    <!-- Link Item 1 -->
    <rect x="24" y="328" width="530" height="76" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <rect x="38" y="340" width="128" height="20" rx="4" fill="#FDECE8"/>
    <text x="102" y="354" text-anchor="middle" class="p-mono" font-size="9.5" fill="#A62616">POSSIBLE DUPLICATE</text>
    <text x="176" y="354" class="p-mono" font-size="11" fill="#141312">AICTE-2026-00001 · SGC</text>
    <text x="538" y="354" text-anchor="end" class="p-mono" font-size="11" fill="#C84B31">74% SIM</text>
    <text x="38" y="382" class="p-sans" font-size="12.5" font-weight="600">Tuition fee refund withheld after withdrawal before deadline</text>

    <!-- Link Item 2 -->
    <rect x="24" y="416" width="530" height="76" rx="10" fill="#FAF7F2" stroke="#E6E0D6" stroke-width="1.2"/>
    <rect x="38" y="428" width="112" height="20" rx="4" fill="#EAF1F8"/>
    <text x="94" y="442" text-anchor="middle" class="p-mono" font-size="9.5" fill="#2A5C8A">CROSS-CELL CTX</text>
    <text x="160" y="442" class="p-mono" font-size="11" fill="#141312">AICTE-2026-00004 · ACB</text>
    <text x="538" y="442" text-anchor="end" class="p-mono" font-size="11" fill="#524E48">45D WIN</text>
    <text x="38" y="470" class="p-sans" font-size="12.5" font-weight="600">Unqualified visiting lecturers conducting core semester labs</text>
  </g>

  <!-- RIGHT WINDOW: Interactive Cross-Cell Link Graph & Link Queue -->
  <g transform="translate(612, 10)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="578" height="520" rx="16" fill="#FAF7F2" stroke="#141312" stroke-width="1.8"/>
    <!-- Window Bar -->
    <path d="M 2 16 Q 2 2 16 2 L 562 2 Q 576 2 576 16 L 576 42 L 2 42 Z" fill="#F2ECE1"/>
    <circle cx="22" cy="22" r="5" fill="#C84B31"/>
    <circle cx="38" cy="22" r="5" fill="#D9822B"/>
    <circle cx="54" cy="22" r="5" fill="#1E5E3A"/>
    <text x="290" y="26" text-anchor="middle" class="p-mono" font-size="10.5" fill="#524E48">/institutions/1 &amp; /links/queue · Cross-Cell Graph</text>

    <!-- Header -->
    <text x="24" y="72" class="p-mono" font-size="10" fill="#2A5C8A">CROSS-BUREAU TOPOLOGY · UNION-FIND CLUSTERS</text>
    <text x="24" y="96" class="p-serif" font-size="20">Multi-Bureau Case Link Graph &amp; Queue</text>

    <!-- Interactive SVG Graph Canvas -->
    <rect x="24" y="112" width="530" height="236" rx="12" fill="#F2ECE1" stroke="#E6E0D6" stroke-width="1.2"/>

    <!-- Graph Edges -->
    <line x1="170" y1="175" x2="290" y2="155" stroke="#C84B31" stroke-width="2.5"/>
    <line x1="290" y1="155" x2="410" y2="185" stroke="#1E5E3A" stroke-width="2" class="edge-flow"/>
    <line x1="170" y1="175" x2="210" y2="285" stroke="#2A5C8A" stroke-width="2" class="edge-flow"/>
    <line x1="410" y1="185" x2="365" y2="285" stroke="#6A3D9A" stroke-width="2" class="edge-flow"/>
    <line x1="210" y1="285" x2="365" y2="285" stroke="#C84B31" stroke-width="2"/>

    <!-- Graph Nodes -->
    <g transform="translate(170, 175)">
      <circle r="22" fill="#C84B31" stroke="#FAF7F2" stroke-width="2.5"/>
      <text y="4" text-anchor="middle" class="p-mono" font-size="10" fill="#FAF7F2">SGC-01</text>
    </g>
    <g transform="translate(290, 155)">
      <circle r="22" fill="#C84B31" stroke="#FAF7F2" stroke-width="2.5"/>
      <text y="4" text-anchor="middle" class="p-mono" font-size="10" fill="#FAF7F2">SGC-02</text>
    </g>
    <g transform="translate(410, 185)">
      <circle r="22" fill="#1E5E3A" stroke="#FAF7F2" stroke-width="2.5"/>
      <text y="4" text-anchor="middle" class="p-mono" font-size="10" fill="#FAF7F2">ACB-04</text>
    </g>
    <g transform="translate(210, 285)">
      <circle r="22" fill="#2A5C8A" stroke="#FAF7F2" stroke-width="2.5"/>
      <text y="4" text-anchor="middle" class="p-mono" font-size="10" fill="#FAF7F2">AB-07</text>
    </g>
    <g transform="translate(365, 285)">
      <circle r="22" fill="#6A3D9A" stroke="#FAF7F2" stroke-width="2.5"/>
      <text y="4" text-anchor="middle" class="p-mono" font-size="10" fill="#FAF7F2">VC-09</text>
    </g>

    <!-- Legend inside Graph -->
    <rect x="38" y="310" width="502" height="26" rx="6" fill="#FAF7F2"/>
    <circle cx="54" cy="323" r="4" fill="#C84B31"/><text x="64" y="327" class="p-mono" font-size="9.5" fill="#141312">SGC (Grievance)</text>
    <circle cx="174" cy="323" r="4" fill="#1E5E3A"/><text x="184" y="327" class="p-mono" font-size="9.5" fill="#141312">ACB (Academic)</text>
    <circle cx="294" cy="323" r="4" fill="#2A5C8A"/><text x="304" y="327" class="p-mono" font-size="9.5" fill="#141312">AB (Approval)</text>
    <circle cx="404" cy="323" r="4" fill="#6A3D9A"/><text x="414" y="327" class="p-mono" font-size="9.5" fill="#141312">VC (Vigilance)</text>

    <!-- Link Resolution Queue Card -->
    <rect x="24" y="364" width="530" height="128" rx="12" fill="#FAF7F2" stroke="#141312" stroke-width="1.3"/>
    <text x="40" y="388" class="p-mono" font-size="10" fill="#C84B31">INSTITUTION-LINK RESOLUTION QUEUE · BUREAU HEAD / ADMIN</text>
    <text x="40" y="412" class="p-sans" font-size="13" font-weight="700">AICTE-2026-00001 (SGC) ↔ AICTE-2026-00002 (SGC)</text>
    <text x="40" y="432" class="p-muted" font-size="11.5">Meridian Institute of Technology · Cosine Similarity: 0.74 (Duplicate)</text>

    <!-- Action Buttons -->
    <rect x="40" y="446" width="144" height="32" rx="6" fill="#1E5E3A"/>
    <text x="112" y="466" text-anchor="middle" class="p-sans" font-size="12" font-weight="600" fill="#FAF7F2">Confirm Link</text>

    <rect x="196" y="446" width="132" height="32" rx="6" fill="#F2ECE1" stroke="#E6E0D6" stroke-width="1"/>
    <text x="262" y="466" text-anchor="middle" class="p-sans" font-size="12" font-weight="600" fill="#141312">Dismiss Pair</text>
  </g>
</svg>
